<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#eef6ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

width:420px;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

font-size:34px;
font-weight:700;
color:#204c9c;
text-align:center;

}

.subtitle{

text-align:center;
margin-top:8px;
margin-bottom:35px;
color:#666;

}

input{

width:100%;
padding:16px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:15px;
font-size:15px;

}

button{

width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#2d5cff;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;

}

button:hover{

background:#204c9c;

}

.footer{

text-align:center;
margin-top:25px;
font-size:13px;
color:#888;

}


.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
.card{width:min(460px,100%);background:#fff;padding:38px;border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.12)}
.logo{text-align:center;color:#204c9c;font-size:32px;font-weight:700}
.subtitle{text-align:center;color:#777;font-size:13px;margin:6px 0 28px}
input{height:46px;padding:0 13px;border:1px solid #dce2eb;border-radius:10px;font-size:12px}
button{height:46px;border-radius:10px;background:#315df4;font-size:13px}
.footer{font-size:10px;color:#8a94a3;margin-top:20px}
</style>

</head>

<body>
<div class="login-page">
<div class="card">

<div class="logo">
Getwell
</div>

<div class="subtitle">
Clinic Staff Login
</div>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<div class="footer">

Getwell Nutrition Coach Admin Portal

</div>

</div></div>
  <script>

document.getElementById("loginBtn").addEventListener("click", function(){

const username = document.getElementById("username").value;
const password = document.getElementById("password").value;

if(username === "admin" && password === "123456"){

    window.location.href = "admin-dashboard.html";

}else{

    alert("Invalid Username or Password");

}

});

</script>
  
</body>
</html>
