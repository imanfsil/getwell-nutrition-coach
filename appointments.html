<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointments Overview</title>

<!-- Poppins -->
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<!-- Font Awesome -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", sans-serif;
}

body{
    background:#eef6ff;
    min-height:100vh;
    color:#17325c;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:200px;
    background:#2b5ba6;
    color:white;
}

.logo{
    height:95px;
    display:flex;
    align-items:center;
    padding-left:27px;

    font-family:"Poppins", sans-serif;
    font-size:26px;
    font-weight:700;

    border-bottom:1px solid rgba(255,255,255,.15);
}

.nav{
    padding:30px 15px;
}

.nav a{
    height:52px;

    display:flex;
    align-items:center;

    gap:15px;

    padding:0 18px;

    margin-bottom:9px;

    border-radius:11px;

    color:white;
    text-decoration:none;

    font-family:"Poppins", sans-serif;
    font-size:15px;
    font-weight:500;
}

.nav a:hover{
    background:rgba(255,255,255,.10);
}

.nav a.active{
    background:white;
    color:#204c9c;

    font-family:"Poppins", sans-serif;
    font-weight:700;
}

.nav-icon{
    width:20px;
    text-align:center;
    font-size:15px;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    margin-left:200px;

    padding:40px 34px 50px;

    min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    margin-bottom:35px;
}

.header h1{
    font-family:"Poppins", sans-serif;

    font-size:36px;
    line-height:1.2;

    color:#204c9c;

    margin-bottom:8px;

    font-weight:700;
}

.header p{
    font-family:"Poppins", sans-serif;

    color:#666;

    font-size:15px;
    font-weight:400;
}

.date-selector{
    background:white;

    border:1px solid #ddd;

    border-radius:10px;

    padding:12px 16px;

    color:#52627a;

    font-family:"Poppins", sans-serif;
    font-size:13px;
    font-weight:400;
}

.date-selector i{
    color:#2858a3;
}


/* =========================================================
   SUMMARY CARDS
========================================================= */

.summary-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;

    margin-bottom:30px;
}

.summary-card{
    background:white;

    padding:22px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    min-height:120px;

    display:flex;
    align-items:center;

    gap:18px;
}

.summary-icon{
    width:58px;
    height:58px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    flex-shrink:0;
}

.summary-icon i{
    font-size:23px;
}

.blue{
    background:#2870f5;
}

.green{
    background:#16b86a;
}

.orange{
    background:#f89b0f;
}

.red{
    background:#ed4a54;
}

.summary-label{
    font-family:"Poppins", sans-serif;

    font-size:13px;

    color:#666;

    margin-bottom:4px;

    font-weight:400;
}

.summary-number{
    font-family:"Poppins", sans-serif;

    font-size:28px;

    line-height:1.2;

    color:#17325c;

    font-weight:700;
}

.summary-sub{
    font-family:"Poppins", sans-serif;

    font-size:10px;

    color:#888;

    margin-top:4px;

    font-weight:400;
}


/* =========================================================
   CONTENT GRID
========================================================= */

.content-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:16px;
}


/* =========================================================
   PANELS
========================================================= */

.panel{
    background:white;

    padding:22px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:17px;
}

.panel-title h2{
    display:flex;
    align-items:center;

    gap:9px;

    font-family:"Poppins", sans-serif;

    font-size:17px;

    color:#204c9c;

    font-weight:700;
}

.panel-title h2 i{
    font-size:15px;
}

.view-all{
    background:#f0f5ff;

    color:#2858a3;

    border:none;

    border-radius:8px;

    padding:8px 12px;

    font-family:"Poppins", sans-serif;

    font-size:10px;

    font-weight:500;

    cursor:pointer;
}

.view-all:hover{
    background:#e6eefb;
}


/* =========================================================
   APPOINTMENT ROWS
========================================================= */

.appointment-row{
    display:grid;

    grid-template-columns:72px 1fr 78px 82px;

    align-items:center;

    min-height:72px;

    gap:12px;

    border-bottom:1px solid #eee;
}

.appointment-row:last-of-type{
    border-bottom:none;
}

.appointment-time{
    font-family:"Poppins", sans-serif;

    font-size:10px;

    color:#2458aa;

    font-weight:600;
}

.patient-name{
    font-family:"Poppins", sans-serif;

    font-size:13px;

    color:#17325c;

    font-weight:700;
}

.appointment-type{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    color:#777;

    margin-top:4px;

    font-weight:400;
}

.doctor{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    color:#666;

    font-weight:400;
}

.status{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    padding:7px 10px;

    border-radius:10px;

    text-align:center;

    white-space:nowrap;

    font-weight:500;
}

.status.scheduled{
    background:#e5f9ee;
    color:#09975b;
}

.status.completed{
    background:#e8f0ff;
    color:#2466cf;
}

.status.no-show{
    background:#ffe8eb;
    color:#d73542;
}


/* =========================================================
   PANEL FOOTER
========================================================= */

.panel-footer{
    margin-top:16px;

    background:#f1f5fd;

    color:#3567bc;

    padding:12px;

    border-radius:9px;

    text-align:center;

    font-family:"Poppins", sans-serif;

    font-size:10px;

    font-weight:500;

    cursor:pointer;
}

.panel-footer.green-footer{
    background:#e6f8ee;
    color:#15965c;
}


/* =========================================================
   MISSED APPOINTMENTS
========================================================= */

.alert-panel .panel-title h2{
    color:#d63c48;
}

.alert-panel .panel-title h2 i{
    color:#d63c48;
}

.alert-row{
    min-height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    border-bottom:1px solid #eee;
}

.alert-row:last-child{
    border-bottom:none;
}

.alert-patient{
    font-family:"Poppins", sans-serif;

    font-size:12px;

    color:#17325c;

    font-weight:700;
}

.alert-date{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    color:#888;

    margin-top:4px;

    font-weight:400;
}

.no-show-badge{
    background:#ffe7ea;

    color:#d73542;

    padding:7px 11px;

    border-radius:8px;

    font-family:"Poppins", sans-serif;

    font-size:9px;

    white-space:nowrap;

    font-weight:500;
}


/* =========================================================
   UPCOMING APPOINTMENTS
========================================================= */

.upcoming-panel{
    grid-column:span 2;
}

.upcoming-days{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:10px;
}

.day-card{
    border:1px solid #dfe5ee;

    border-radius:10px;

    padding:13px;

    min-height:150px;
}

.day-header{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.day-name{
    font-family:"Poppins", sans-serif;

    font-size:10px;

    color:#263d62;

    font-weight:700;
}

.day-date{
    font-family:"Poppins", sans-serif;

    font-size:8px;

    color:#888;

    margin-top:4px;

    font-weight:400;
}

.count{
    background:#2858a7;

    color:white;

    padding:4px 7px;

    border-radius:5px;

    font-family:"Poppins", sans-serif;

    font-size:8px;

    font-weight:600;
}

.day-time{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    color:#55657d;

    margin-top:12px;

    font-weight:400;
}

.add-slot{
    font-family:"Poppins", sans-serif;

    font-size:8px;

    color:#3567bc;

    text-align:center;

    margin-top:18px;

    cursor:pointer;

    font-weight:500;
}


/* =========================================================
   FOLLOW-UP
========================================================= */

.followup-panel .panel-title h2{
    color:#e37b00;
}

.followup-panel .panel-title h2 i{
    color:#e37b00;
}

.days-away{
    font-family:"Poppins", sans-serif;

    font-size:9px;

    color:#888;

    white-space:nowrap;

    font-weight:400;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-actions{
    display:flex;

    flex-direction:column;

    gap:11px;
}

.quick-btn{
    width:100%;

    height:46px;

    border:none;

    border-radius:9px;

    font-family:"Poppins", sans-serif;

    font-size:11px;

    font-weight:500;

    background:#f1f4fb;

    color:#52627a;

    cursor:pointer;
}

.quick-btn i{
    margin-right:7px;
}

.quick-btn.primary{
    background:#315df4;

    color:white;

    font-weight:600;
}

.quick-btn:hover{
    opacity:.9;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(15,31,55,.45);

    align-items:center;

    justify-content:center;

    z-index:1000;
}

.modal-content{
    position:relative;

    width:450px;

    background:white;

    border-radius:18px;

    padding:30px;

    box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.close-btn{
    position:absolute;

    right:20px;
    top:15px;

    font-size:25px;

    color:#8792a3;

    cursor:pointer;
}

.modal-content h2{
    font-family:"Poppins", sans-serif;

    font-size:24px;

    color:#204c9c;

    margin-bottom:22px;

    font-weight:700;
}

.modal-content input{
    width:100%;

    padding:15px;

    border:1px solid #ddd;

    border-radius:10px;

    font-family:"Poppins", sans-serif;

    font-size:14px;

    font-weight:400;

    outline:none;

    margin-bottom:12px;
}

.modal-content input:focus{
    border-color:#204c9c;
}

.save-btn{
    width:100%;

    padding:14px;

    background:#204c9c;

    color:white;

    border:none;

    border-radius:10px;

    font-family:"Poppins", sans-serif;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1250px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .content-grid{
        grid-template-columns:1fr 1fr;
    }

    .upcoming-panel{
        grid-column:span 2;
    }

}


@media(max-width:900px){

    .sidebar{
        width:180px;
    }

    .main{
        margin-left:180px;

        padding:30px;
    }

    .summary-grid{
        grid-template-columns:1fr;
    }

    .content-grid{
        grid-template-columns:1fr;
    }

    .upcoming-panel{
        grid-column:span 1;
    }

    .upcoming-days{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
