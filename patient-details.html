<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Details - Getwell</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="api.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}

html{font-size:16px}

body{
  background:#eef5fc;
  color:#17325c;
  min-height:100vh;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* =========================
   SIDEBAR — SAME MASTER UI
========================= */
.sidebar{
  width:258px;
  min-height:100vh;
  background:#2b5ba6;
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:1000;
}

.logo{
  height:118px;
  display:flex;
  align-items:center;
  padding-left:42px;
  font-size:32px;
  font-weight:700;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.nav{padding:42px 20px}

.nav a{
  width:100%;
  height:64px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 25px;
  margin-bottom:9px;
  border-radius:13px;
  color:#fff;
  text-decoration:none;
  font-size:16px;
  font-weight:500;
}

.nav a:hover{background:rgba(255,255,255,.10)}

.nav a.active{
  background:#fff;
  color:#204c9c;
  font-weight:700;
}

.nav-icon{
  width:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

/* =========================
   MAIN
========================= */
.main{
  margin-left:258px;
  width:calc(100% - 258px);
  min-height:100vh;
  padding:42px 42px 55px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:28px;
}

.header h1{
  color:#204c9c;
  font-size:36px;
  line-height:1.2;
  font-weight:700;
  margin-bottom:7px;
}

.header p{
  color:#666;
  font-size:15px;
}

.profile-actions{
  display:flex;
  gap:10px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  font-size:12px;
  font-weight:600;
}

.btn.primary{
  background:#315df4;
  color:#fff;
}

.btn.secondary{
  background:#eef3fb;
  color:#31569a;
}

.btn.primary:hover{background:#2854e6}

/* =========================
   PROFILE HEADER
========================= */
.profile-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.profile-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.profile-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:13px;
  background:#315df4;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:600;
}

.profile-name{
  color:#24539f;
  font-size:22px;
  font-weight:700;
  line-height:1.2;
}

.profile-id{
  color:#7d899b;
  font-size:10px;
  margin-top:4px;
}

.status-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 13px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
}

.status-badge.active{
  background:#e1f8ec;
  color:#0a9b59;
}

.status-badge.completed,
.status-badge.inactive{
  background:#f1f3f6;
  color:#7a8493;
}

.status-badge.scheduled{
  background:#eef3ff;
  color:#315fc0;
}

/* =========================
   SUMMARY
========================= */
.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
  margin-top:20px;
}

.summary-box{
  background:#f5f8fc;
  border-radius:12px;
  padding:16px;
  min-height:82px;
}

.summary-label{
  color:#7a889d;
  font-size:9px;
  margin-bottom:8px;
}

.summary-value{
  color:#234b89;
  font-size:13px;
  font-weight:600;
  line-height:1.45;
}

/* =========================
   CONTENT SECTIONS
========================= */
.section{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.section-title{
  color:#204c9c;
  font-size:16px;
  font-weight:600;
  margin-bottom:16px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}

.info-item{
  padding:4px 0;
}

.info-label{
  color:#7a889d;
  font-size:9px;
  margin-bottom:6px;
}

.info-value{
  color:#173b70;
  font-size:11px;
  font-weight:600;
  word-break:break-word;
}

/* =========================
   TABLES
========================= */
.table-wrap{
  overflow-x:auto;
}

.data-table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

.data-table thead{
  background:#f1f5fd;
}

.data-table th{
  text-align:left;
  padding:12px;
  color:#24539f;
  font-size:10px;
  font-weight:600;
}

.data-table td{
  padding:13px 12px;
  border-bottom:1px solid #edf0f5;
  color:#53627a;
  font-size:10px;
}

.data-table tbody tr:hover{
  background:#fafcff;
}

.empty{
  text-align:center!important;
  color:#8a96a8!important;
  padding:25px!important;
}

/* =========================
   MODAL
========================= */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(19,38,66,.48);
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:min(650px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 20px 55px rgba(0,0,0,.20);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:20px;
}

.modal-header h2{
  color:#204c9c;
  font-size:20px;
  font-weight:700;
}

.modal-header p{
  color:#7d899b;
  font-size:10px;
  margin-top:4px;
}

.close-modal{
  border:0;
  background:transparent;
  color:#7e899a;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{grid-column:1/-1}

.field label{
  color:#52627a;
  font-size:10px;
  font-weight:600;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #dce2eb;
  border-radius:9px;
  padding:10px 11px;
  outline:none;
  color:#17325c;
  background:#fff;
  font-size:11px;
}

.field input,
.field select{height:40px}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#315df4;
  box-shadow:0 0 0 3px rgba(49,93,244,.08);
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}

/* =========================
   LOADING
========================= */
.loading{
  background:#fff;
  border-radius:18px;
  padding:45px;
  text-align:center;
  color:#7d899b;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.loading i{
  font-size:24px;
  color:#315df4;
  margin-bottom:10px;
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:1100px){
  .summary-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .info-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:850px){
  .sidebar{
    width:180px;
  }

  .main{
    margin-left:180px;
    width:calc(100% - 180px);
    padding:30px 20px;
  }

  .nav a{
    padding:0 16px;
    font-size:13px;
  }

  .logo{
    padding-left:25px;
  }
}

@media(max-width:600px){
  .sidebar{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .logo{
    height:75px;
  }

  .nav{
    padding:15px;
  }

  .nav a{
    height:45px;
    margin-bottom:5px;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:25px 15px;
  }

  .header{
    flex-direction:column;
    gap:15px;
  }

  .header h1{
    font-size:28px;
  }

  .profile-actions{
    width:100%;
  }

  .profile-actions .btn{
    flex:1;
  }

  .summary-grid,
  .info-grid,
  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .profile-top{
    gap:15px;
  }
}
</style>
</head>

<body>

<script>

let detailData = null;

const patientId =
  getPatientIdFromUrl();


/* =========================
   HELPERS
========================= */

function valueOrDash(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){
    return "—";
  }

  return String(value);
}


function escapeText(value){

  return escapeHtmlSafe(
    valueOrDash(value)
  );

}


function initials(name){

  const parts =
    String(name || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(!parts.length) return "PT";

  if(parts.length === 1){
    return parts[0]
      .substring(0,2)
      .toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length-1][0]
  ).toUpperCase();

}


function formatDate(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){
    return "—";
  }

  const text = String(value).trim();

  let date;

  if(/^\d{4}-\d{2}-\d{2}/.test(text)){
    date = new Date(
      text.replace(" ","T")
    );
  }else{
    date = new Date(text);
  }

  if(isNaN(date.getTime())){
    return text;
  }

  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function formatTime(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){
    return "—";
  }

  const text = String(value).trim();

  /*
    Handles:
    09:00:00
    1899-12-30 09:00:00
    2026-08-10 09:00:00
  */

  const timeMatch =
    text.match(
      /(\d{1,2}):(\d{2})(?::(\d{2}))?/
    );

  if(!timeMatch){
    return text;
  }

  let hour =
    Number(timeMatch[1]);

  const minute =
    timeMatch[2];

  const suffix =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12 || 12;

  return `${hour}:${minute} ${suffix}`;

}


function formatDateTime(
  dateValue,
  timeValue
){

  const date =
    formatDate(dateValue);

  const time =
    formatTime(timeValue);

  if(date === "—") return "—";

  if(time === "—") return date;

  return `${date} · ${time}`;

}


function statusClass(status){

  const value =
    String(status || "")
      .toLowerCase();

  if(value === "active")
    return "active";

  if(
    value === "completed" ||
    value === "inactive"
  )
    return "completed";

  return "scheduled";

}


function appointmentDateTime(
  appointment
){

  return formatDateTime(
    appointment.appointment_date,
    appointment.appointment_time
  );

}


/* =========================
   RENDER
========================= */

function renderPatient(data){

  detailData = data;

  const patient =
    data.patient;

  if(!patient){
    throw new Error(
      "Patient record was not returned by the database."
    );
  }


  document.getElementById(
    "pageTitle"
  ).textContent =
    patient.full_name ||
    "Patient Details";


  document.getElementById(
    "pageSubtitle"
  ).textContent =
    `${patient.patient_id || patientId} · ${patient.status || "—"}`;


  const appointments =
    Array.isArray(data.appointments)
      ? [...data.appointments]
      : [];


  const visits =
    Array.isArray(data.visits)
      ? [...data.visits]
      : [];


  const weights =
    Array.isArray(data.weightTracking)
      ? [...data.weightTracking]
      : [];


  const wellness =
    Array.isArray(data.wellness)
      ? [...data.wellness]
      : [];


  appointments.sort(
    (a,b) =>
      String(
        b.appointment_date || ""
      ).localeCompare(
        String(
          a.appointment_date || ""
        )
      )
  );


  visits.sort(
    (a,b) =>
      String(
        b.visit_date || ""
      ).localeCompare(
        String(
          a.visit_date || ""
        )
      )
  );


  weights.sort(
    (a,b) =>
      String(
        b.date || ""
      ).localeCompare(
        String(
          a.date || ""
        )
      )
  );


  wellness.sort(
    (a,b) =>
      String(
        b.date || ""
      ).localeCompare(
        String(
          a.date || ""
        )
      )
  );


  const upcoming =
    appointments.find(
      a => {

        const status =
          String(
            a.status || ""
          ).toLowerCase();

        return (
          status !== "completed" &&
          status !== "cancelled" &&
          status !== "cancelled by patient" &&
          status !== "no show" &&
          status !== "missed"
        );

      }
    );


  const latestCompleted =
    appointments.find(
      a =>
        String(
          a.status || ""
        ).toLowerCase() ===
        "completed"
    );


  const status =
    patient.status ||
    "Active";


  document.getElementById(
    "pageContent"
  ).innerHTML = `

    <!-- PROFILE HEADER -->
    <div class="profile-card">

      <div class="profile-top">

        <div class="profile-left">

          <div class="avatar">
            ${escapeText(
              initials(
                patient.full_name
              )
            )}
          </div>

          <div>

            <div class="profile-name">
              ${escapeText(
                patient.full_name
              )}
            </div>

            <div class="profile-id">
              ${escapeText(
                patient.patient_id
              )}
            </div>

          </div>

        </div>


        <span
          class="status-badge ${statusClass(status)}">

          <i class="fa-solid fa-circle"></i>

          ${escapeText(status)}

        </span>

      </div>


      <!-- SUMMARY -->
      <div class="summary-grid">

        <div class="summary-box">
          <div class="summary-label">
            Phone Number
          </div>

          <div class="summary-value">
            ${escapeText(
              patient.phone
            )}
          </div>
        </div>


        <div class="summary-box">
          <div class="summary-label">
            Age / Gender
          </div>

          <div class="summary-value">
            ${escapeText(
              patient.age
            )}
            /
            ${escapeText(
              patient.gender
            )}
          </div>
        </div>


        <div class="summary-box">
          <div class="summary-label">
            Current Weight
          </div>

          <div class="summary-value">
            ${
              patient.current_weight_kg
                ? escapeText(
                    patient.current_weight_kg
                  ) + " kg"
                : "—"
            }
          </div>
        </div>


        <div class="summary-box">
          <div class="summary-label">
            Next Appointment
          </div>

          <div class="summary-value">

            ${
              upcoming
                ? appointmentDateTime(
                    upcoming
                  )
                : "—"
            }

          </div>
        </div>

      </div>

    </div>


    <!-- PATIENT INFORMATION -->
    <section class="section">

      <div class="section-title">
        Patient Information
      </div>

      <div class="info-grid">

        <div class="info-item">
          <div class="info-label">
            Patient ID
          </div>
          <div class="info-value">
            ${escapeText(
              patient.patient_id
            )}
          </div>
        </div>


        <div class="info-item">
          <div class="info-label">
            Date of Birth
          </div>
          <div class="info-value">
            ${escapeText(
              formatDate(
                patient.date_of_birth
              )
            )}
          </div>
        </div>


        <div class="info-item">
          <div class="info-label">
            Gender
          </div>
          <div class="info-value">
            ${escapeText(
              patient.gender
            )}
          </div>
        </div>


        <div class="info-item">
          <div class="info-label">
            Height
          </div>
          <div class="info-value">
            ${
              patient.height_cm
                ? escapeText(
                    patient.height_cm
                  ) + " cm"
                : "—"
            }
          </div>
        </div>


        <div class="info-item">
          <div class="info-label">
            Goal Weight
          </div>
          <div class="info-value">
            ${
              patient.goal_weight_kg
                ? escapeText(
                    patient.goal_weight_kg
                  ) + " kg"
                : "—"
            }
          </div>

        <div class="info-item">

/* =========================

========================= */

async function loadPatient(){

  try{

    if(!patientId){
      throw new Error(
        "No patient ID was provided."
      );
    }


    const data =
      await apiGet(
        "getPatientDetails",
        {
          patientId:
            patientId
        }
      );


    renderPatient(data);

  }catch(error){

    console.error(
      "Getwell Patient Details:",
      error
    );

    document.getElementById(
      "pageSubtitle"
    ).textContent =
      "Unable to load patient record.";

    document.getElementById(
      "pageContent"
    ).innerHTML = `

      <div class="loading">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <div>
          Unable to load patient data.
        </div>

        <div style="
          margin-top:8px;
          font-size:10px;
          color:#8a96a8;
        ">
          ${escapeHtmlSafe(
            error.message
          )}
        </div>

      </div>

    `;

  }

}

}


function normalizeDateForInput(
  value
){

  if(!value){
    return "";
  }

  const text =
    String(value);

  const match =
    text.match(
      /^(\d{4}-\d{2}-\d{2})/
    );

  if(match){
    return match[1];
  }

  const date =
    new Date(text);

  if(
    isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return [
    date.getFullYear(),
    String(
      date.getMonth()+1
    ).padStart(2,"0"),
    String(
      date.getDate()
    ).padStart(2,"0")
  ].join("-");

}


function closeEdit(){

  document.getElementById(
    "editModal"
  ).classList.remove(
    "show"
  );

}

========================= */

async function saveEdit(){

  const button =
    document.getElementById(
      "saveButton"
    );


  try{

    button.disabled = true;
    button.textContent =
      "Saving...";


    await apiPost(
      "updatePatient",
      {

        patient_id:
          patientId,

        full_name:
          document.getElementById(
            "f_name"
          ).value.trim(),

        phone:
          document.getElementById(
            "f_phone"
          ).value.trim(),

        date_of_birth:
          document.getElementById(
            "f_dob"
          ).value,

        gender:
          document.getElementById(
            "f_gender"
          ).value,

        height_cm:
          document.getElementById(
            "f_height"
          ).value,

        goal_weight_kg:
          document.getElementById(
            "f_goal"
          ).value,

        attending_doctor:
          document.getElementById(
            "f_doctor"
          ).value.trim(),

        status:
          document.getElementById(
            "f_status"
          ).value,

        remarks:
          document.getElementById(
            "f_remarks"
          ).value.trim()

      }
    );


    closeEdit();


    await loadPatient();


    alert(
      "Patient updated successfully."
    );


  }catch(error){

    showApiError(
      error,
      "Unable to update patient."
    );


  }finally{

    button.disabled = false;
    button.textContent =
      "Save Changes";

  }

}
