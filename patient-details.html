<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Details | Getwell</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="api.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Arial,sans-serif;background:#f6f8fc;color:#17325c}.sidebar{position:fixed;left:0;top:0;width:258px;height:100vh;background:#fff;border-right:1px solid #e8ecf2}.logo{height:118px;display:flex;align-items:center;padding-left:36px;font-size:34px;font-weight:700;color:#24539f}.nav{padding:24px 18px}.nav a{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;color:#667085;text-decoration:none;border-radius:12px;font-size:14px;margin-bottom:6px}.nav a.active,.nav a:hover{background:#eef4ff;color:#24539f}.nav-icon{width:22px;text-align:center}.main{margin-left:258px;padding:42px 42px 60px}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;color:#7b8798;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600}.primary{background:#24539f;color:white}.secondary{background:#edf2f8;color:#24539f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e8ecf2;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(20,50,90,.04)}.label{font-size:11px;color:#8a96a8;text-transform:uppercase;letter-spacing:.05em}.value{font-size:20px;font-weight:700;margin-top:7px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #edf0f5;text-align:left}.table th{color:#6f7b8e;font-size:10px;text-transform:uppercase}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#24539f;font-size:10px;font-weight:600}.muted{color:#8a96a8}.profile-actions{display:flex;gap:10px}.modal{position:fixed;inset:0;background:rgba(15,30,55,.35);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;padding:24px;width:min(560px,100%)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;color:#68758a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dce2eb;border-radius:9px;font:inherit;font-size:12px}.field.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.sidebar{width:200px}.main{margin-left:200px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:25px 15px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style></head><body><aside class="sidebar"><div class="logo">Getwell</div><nav class="nav"><a href="admin-dashboard.html"><span class="nav-icon"><i class="fa-solid fa-house"></i></span>Dashboard</a><a href="register-patient.html"><span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span>Register Patient</a><a href="patient-list.html" class="active"><span class="nav-icon"><i class="fa-solid fa-users"></i></span>Patient List</a><a href="appointments.html"><span class="nav-icon"><i class="fa-regular fa-calendar-check"></i></span>Appointments</a><a href="reports.html"><span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span>Reports</a><a href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a><a href="admin-login.html"><span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span>Logout</a></nav></aside><main class="main"><div class="header"><div><h1 id="title">Patient Details</h1><p id="subtitle">Loading patient record…</p></div><div class="profile-actions"><button class="btn secondary" onclick="history.back()">Back</button><button class="btn primary" onclick="openEdit()">Edit Patient</button></div></div><div id="content"></div></main><div class="modal" id="editModal"><div class="modal-box"><h2>Edit Patient</h2><div class="form-grid"><div class="field"><label>Full Name</label><input id="f_name"></div><div class="field"><label>Phone</label><input id="f_phone"></div><div class="field"><label>Date of Birth</label><input id="f_dob" type="date"></div><div class="field"><label>Gender</label><select id="f_gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div><div class="field"><label>Height (cm)</label><input id="f_height" type="number"></div><div class="field"><label>Goal Weight (kg)</label><input id="f_goal" type="number"></div><div class="field"><label>Doctor</label><input id="f_doctor"></div><div class="field"><label>Status</label><select id="f_status"><option>Active</option><option>Inactive</option><option>Completed</option></select></div><div class="field full"><label>Remarks</label><textarea id="f_remarks"></textarea></div></div><div class="actions"><button class="btn secondary" onclick="closeEdit()">Cancel</button><button class="btn primary" onclick="saveEdit()">Save Changes</button></div></div></div><script>
let detailData=null; const patientId=getPatientIdFromUrl();
function fmt(v){return v||'—'}
function rowTable(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${escapeHtmlSafe(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${escapeHtmlSafe(x)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="muted">No records.</td></tr>`}</tbody></table></div>`}
function render(d){const p=d.patient;document.getElementById('title').textContent=p.full_name;document.getElementById('subtitle').textContent=`${p.patient_id} · ${p.status||'—'}`;document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Phone</div><div class="value">${escapeHtmlSafe(fmt(p.phone))}</div></div><div class="card"><div class="label">Age / Gender</div><div class="value">${escapeHtmlSafe(fmt(p.age))} / ${escapeHtmlSafe(fmt(p.gender))}</div></div><div class="card"><div class="label">Current Weight</div><div class="value">${escapeHtmlSafe(fmt(p.current_weight_kg))} kg</div></div><div class="card"><div class="label">Next Appointment</div><div class="value">${escapeHtmlSafe(p.next_appointment||'—')}</div></div></div><div class="section card"><h2>Patient Information</h2>${rowTable(['Field','Value'],[['Patient ID',p.patient_id],['Date of Birth',p.date_of_birth],['Height',p.height_cm?`${p.height_cm} cm`:'—'],['Goal Weight',p.goal_weight_kg?`${p.goal_weight_kg} kg`:'—'],['Programme Start',p.programme_start_date],['Attending Doctor',p.attending_doctor],['Last Visit',p.last_visit||'—'],['Remarks',p.remarks||'—']])}</div><div class="section card"><h2>Appointments</h2>${rowTable(['Date','Time','Type','Doctor','Status'],(d.appointments||[]).sort((a,b)=>String(b.appointment_date).localeCompare(String(a.appointment_date))).map(a=>[a.appointment_date,a.appointment_time,a.appointment_type,a.doctor,a.status]))}</div><div class="section card"><h2>Visit History</h2>${rowTable(['Date','Type','Doctor','Status','Weight','Remarks'],(d.visits||[]).sort((a,b)=>String(b.visit_date).localeCompare(String(a.visit_date))).map(v=>[v.visit_date,v.visit_type,v.doctor,v.status,v.weight_kg||'—',v.remarks||'—']))}</div><div class="section card"><h2>Weight Tracking</h2>${rowTable(['Date','Weight','BMI','Notes'],(d.weightTracking||[]).sort((a,b)=>String(b.record_date).localeCompare(String(a.record_date))).map(w=>[w.record_date,w.weight_kg?`${w.weight_kg} kg`:'—',w.bmi||'—',w.notes||'—']))}</div><div class="section card"><h2>Daily Wellness</h2>${rowTable(['Date','Calories','Water','Exercise','Notes'],(d.dailyWellness||[]).sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(w=>[w.date,w.calories_kcal||'—',w.water_litres||'—',w.exercise||'—',w.notes||'—']))}</div>`}
async function load(){try{if(!patientId)throw new Error('No patient ID was provided.');detailData=await apiGet('getPatientDetails',{patientId});render(detailData)}catch(e){showApiError(e);document.getElementById('subtitle').textContent='Unable to load patient record.'}}
function openEdit(){const p=detailData.patient;['name','phone','dob','gender','height','goal','doctor','status','remarks'].forEach(k=>{});document.getElementById('f_name').value=p.full_name||'';document.getElementById('f_phone').value=p.phone||'';document.getElementById('f_dob').value=(p.date_of_birth||'').slice(0,10);document.getElementById('f_gender').value=p.gender||'';document.getElementById('f_height').value=p.height_cm||'';document.getElementById('f_goal').value=p.goal_weight_kg||'';document.getElementById('f_doctor').value=p.attending_doctor||'';document.getElementById('f_status').value=p.status||'Active';document.getElementById('f_remarks').value=p.remarks||'';document.getElementById('editModal').classList.add('show')}
function closeEdit(){document.getElementById('editModal').classList.remove('show')}
async function saveEdit(){try{await apiPost('updatePatient',{patient_id:patientId,full_name:document.getElementById('f_name').value,phone:document.getElementById('f_phone').value,date_of_birth:document.getElementById('f_dob').value,gender:document.getElementById('f_gender').value,height_cm:document.getElementById('f_height').value,goal_weight_kg:document.getElementById('f_goal').value,attending_doctor:document.getElementById('f_doctor').value,status:document.getElementById('f_status').value,remarks:document.getElementById('f_remarks').value});closeEdit();await load();alert('Patient updated successfully.')}catch(e){showApiError(e)}}
load();
</script></body></html>
