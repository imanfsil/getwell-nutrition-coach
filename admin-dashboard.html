<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef6ff;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#204c9c;
color:white;
}

.logo{
font-size:34px;
font-weight:700;
text-align:center;
padding:40px 20px;
border-bottom:1px solid rgba(255,255,255,.15);
}

.main-content{
flex:1;
padding:40px;
}

.header{
margin-bottom:40px;
}

.header h1{
font-size:34px;
color:#204c9c;
}

.header p{
margin-top:8px;
color:#666;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h3{
font-size:16px;
color:#666;
margin-bottom:15px;
}

.number{
font-size:34px;
font-weight:700;
color:#204c9c;
}
.search-section{

margin-top:40px;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.search-section h2{

font-size:22px;
color:#204c9c;
margin-bottom:20px;

}

.search-section input{

width:100%;
padding:16px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none;

}

.search-section input:focus{

border-color:#204c9c;

}
  

.search-section input:focus{

border-color:#204c9c;

}

</style>
  
</head>

<body>

<div class="container">

<div class="sidebar">

<h1 class="logo">
Getwell
</h1>

</div>

<div class="main-content">

<div class="header">

<h1>Dashboard</h1>

<p>Welcome back, Clinic Team 👋</p>

</div>

<div class="cards">

<div class="card">
<h3>Total Patients</h3>
<div class="number">128</div>
</div>

<div class="card">
<h3>Today's Appointments</h3>
<div class="number">8</div>
</div>

<div class="card">
<h3>Active Patients</h3>
<div class="number">104</div>
</div>

<div class="card">
<h3>Completed Goals</h3>
<div class="number">21</div>
</div>

<div class="search-section">

<h2>Search Patient</h2>

<input
type="text"
placeholder="Search by Patient ID, Name or Phone Number">

</div>
  
</div>

</div>

</div>

</body>

</html>
