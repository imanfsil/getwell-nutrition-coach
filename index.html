<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Nutrition Coach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:radial-gradient(circle at top,#F4F9FF 0%,#D9E8FF 45%,#A8C6FF 100%);
position:relative;
}

/* Background Glow */

body::before{
content:"";
position:absolute;
width:650px;
height:650px;
background:rgba(80,130,255,.18);
border-radius:50%;
filter:blur(120px);
bottom:-200px;
left:50%;
transform:translateX(-50%);
}

/* Grid */

.grid{
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
background-size:40px 40px;
opacity:.5;
}

/* Login Card */

.card{

position:relative;
z-index:2;

width:90%;
max-width:420px;

background:rgba(255,255,255,.72);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.7);

border-radius:28px;

padding:45px 30px;

text-align:center;

box-shadow:0 20px 50px rgba(0,60,180,.15);

}

/* Logo */

.logo{

width:75px;
height:75px;

margin:auto;
margin-bottom:20px;

background:linear-gradient(135deg,#2F5FD7,#6EA3FF);

border-radius:22px;

display:flex;
justify-content:center;
align-items:center;

font-size:32px;
color:white;
font-weight:700;

}

/* Text */

.small{

font-size:13px;
color:#6D7B91;
margin-bottom:8px;

}

h1{

font-size:36px;
font-weight:700;
line-height:1.15;

color:#2D4FA6;

margin-bottom:15px;

}

.subtitle{

font-size:17px;
font-weight:600;
color:#37445A;

margin-bottom:12px;

}

.description{

font-size:14px;
color:#7D8899;
line-height:1.7;
margin-bottom:30px;

}

/* Inputs */

input{

width:100%;
height:56px;

border:none;

border-radius:18px;

background:white;

padding:0 18px;

font-size:15px;

margin-bottom:18px;

outline:none;

box-shadow:0 8px 18px rgba(0,0,0,.05);

transition:.3s;

}

input:focus{

border:2px solid #4E7FFF;

}

/* Button */

button{

width:100%;
height:58px;

border:none;

border-radius:18px;

background:linear-gradient(135deg,#3767E8,#5B8CFF);

color:white;

font-size:18px;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:0 15px 30px rgba(54,104,232,.35);

}

button:hover{

transform:translateY(-3px);

}

/* Help */

.help{

margin-top:22px;

font-size:14px;

color:#8794A8;

}

</style>

</head>

<body>

<div class="grid"></div>

<div class="card">

<div class="logo">
G
</div>

<div class="small">
Powered by Getwell Clinic
</div>

<h1>
Getwell Nutrition Coach
</h1>

<div class="subtitle">
Your personal health companion.
</div>

<div class="description">
Log in with your Patient ID to access your food diary, nutrition guidance, progress tracking and personalised recommendations.
</div>

<input type="text" placeholder="Patient ID">

<input type="password" placeholder="Password">

<button>
Sign In
</button>

<div class="help">
Need help? Contact Getwell Clinic
</div>

</div>

</body>

</html>
