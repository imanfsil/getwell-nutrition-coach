<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Getwell Nutrition Coach</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;

            background:
            radial-gradient(circle at top,#EAF3FF 0%,#C7DFFF 40%,#8EB6FF 100%);
        }

        h1{
            font-size:42px;
            font-weight:700;
            color:#2953A6;
            line-height:1.1;
            margin-bottom:15px;
        }

        h2{
            font-size:24px;
            font-weight:600;
            color:#404A5A;
            margin-bottom:15px;
        }

        p{
            color:#7E8797;
            line-height:1.7;
        }

        .login-card{

            width:420px;
            max-width:100%;

            background:rgba(255,255,255,.72);

            backdrop-filter:blur(22px);

            border:1px solid rgba(255,255,255,.7);

            border-radius:30px;

            padding:50px 40px;

            text-align:center;

            box-shadow:
            0 25px 60px rgba(48,82,170,.18);

        }

        input{

            width:100%;

            height:58px;

            border:none;

            border-radius:18px;

            margin-top:18px;

            padding:0 20px;

            font-size:16px;

            background:rgba(255,255,255,.9);

            outline:none;

        }

        button{

            width:100%;

            height:58px;

            margin-top:25px;

            border:none;

            border-radius:18px;

            font-size:18px;

            font-weight:700;

            color:white;

            cursor:pointer;

            background:
            linear-gradient(135deg,#3567E5,#5D8BFF);

            box-shadow:
            0 15px 35px rgba(53,103,229,.35);

            transition:.3s;

        }

        button:hover{

            transform:translateY(-3px);

        }

        .help{

            display:block;

            margin-top:25px;

            color:#8791A2;

            text-decoration:none;

        }

    </style>

</head>
