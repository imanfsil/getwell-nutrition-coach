<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Nutrition Coach</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(180deg,#EEF5FC,#FFFFFF);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:25px;

}

.container{

width:100%;
max-width:430px;

}

.logo{

text-align:center;

font-size:34px;

font-weight:700;

color:#1F4E96;

margin-bottom:18px;

}

.subtitle{

text-align:center;

font-size:18px;

font-weight:600;

color:#444;

margin-bottom:12px;

}

.description{

text-align:center;

font-size:15px;

line-height:1.6;

color:#777;

margin-bottom:35px;

}

input{

width:100%;

padding:18px;

font-size:16px;

border:1px solid #D9D9D9;

border-radius:15px;

margin-bottom:18px;

outline:none;

background:white;

}

input:focus{

border:1px solid #1F4E96;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:15px;

background:#1F4E96;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#173D76;

}

.footer{

text-align:center;

margin-top:35px;

font-size:14px;

color:#999;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

Getwell Nutrition Coach

</div>

<div class="subtitle">

Your personal health companion.

</div>

<div class="description">

Log in with your Patient ID to access your food diary, nutrition guidance, progress tracking, and personalised recommendations.

</div>

<input
type="text"
placeholder="Patient ID">

<input
type="password"
placeholder="Password">

<button>

Login

</button>

<div class="footer">

Need help? Contact Getwell Clinic.

</div>

</div>

</body>

</html>
