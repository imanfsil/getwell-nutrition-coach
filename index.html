<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getwell Nutrition Coach</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f9fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
width:90%;
max-width:380px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
color:#1E4D8C;
text-align:center;
margin-bottom:5px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#1E4D8C;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#163d6b;
}

.footer{
margin-top:20px;
font-size:13px;
color:gray;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>🌿 Getwell</h1>

<p>Nutrition Coach</p>

<input type="text" placeholder="Patient ID">

<input type="password" placeholder="Password">

<button>Login</button>

<div class="footer">

For Getwell Weight Loss Patients Only

</div>

</div>

</body>
</html>
