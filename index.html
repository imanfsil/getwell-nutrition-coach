<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Nutrition Coach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
overflow:hidden;
background:linear-gradient(180deg,#eef5ff 0%,#dbe9ff 45%,#a9c8ff 100%);
position:relative;
}

/* Background Grid */

body::before{
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
background-size:40px 40px;
opacity:.6;
}

/* Blue Glow */

body::after{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#5f8dff55 0%,transparent 70%);
bottom:-260px;
left:50%;
transform:translateX(-50%);
filter:blur(80px);
}

/* Login Card */

.card{
position:relative;
z-index:2;
width:100%;
max-width:420px;
background:rgba(255,255,255,.78);
backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,.7);
border-radius:30px;
padding:40px 28px;
box-shadow:0 20px 50px rgba(44,87,185,.15);
text-align:center;
}

/* Title */

h1{
font-size:46px;
font-weight:700;
line-height:1.05;
color:#2953A8;
margin-bottom:20px;
}

.subtitle{
font-size:17px;
font-weight:600;
color:#384860;
margin-bottom:12px;
}

.description{
font-size:15px;
line-height:1.8;
color:#79879d;
margin-bottom:35px;
}

/* Inputs */

input{
width:100%;
height:58px;
margin-bottom:18px;
border:none;
outline:none;
padding:0 20px;
border-radius:18px;
background:white;
font-size:16px;
box-shadow:0 8px 20px rgba(0,0,0,.05);
transition:.3s;
}

input:focus{
box-shadow:0 0 0 3px rgba(75,120,255,.18);
}

/* Button */

button{
width:100%;
height:60px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#3568e8,#5d8cff);
color:white;
font-size:20px;
font-weight:700;
cursor:pointer;
transition:.3s;
box-shadow:0 18px 35px rgba(53,104,232,.35);
}

button:hover{
transform:translateY(-2px);
}

.help{
margin-top:25px;
font-size:14px;
color:#8d97a8;
}

/* Mobile */

@media(max-width:480px){

.card{
padding:35px 22px;
}

h1{
font-size:40px;
}

.subtitle{
font-size:16px;
}

.description{
font-size:14px;
}

}

</style>

</head>

<body>

<div class="card">

<h1>
Getwell<br>
Nutrition<br>
Coach
</h1>

<div class="subtitle">
Your personal health companion.
</div>

<div class="description">
Log in with your Patient ID to access your food diary, nutrition guidance, progress tracking, and personalised recommendations.
</div>

<input
    id="patientId"
    type="text"
    placeholder="Patient ID"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button id="loginBtn">
    Sign In
</button>

<div class="help">
Need help? Contact Getwell Clinic
</div>

</div>

<script type="module" src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
