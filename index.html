<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Nutrition Coach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">

    <!-- Grid -->
    <div class="grid"></div>

    <!-- Glow -->
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <!-- Floating Stars -->
    <span class="star" style="top:12%;left:18%;"></span>
    <span class="star" style="top:18%;left:72%;"></span>
    <span class="star" style="top:25%;left:40%;"></span>
    <span class="star" style="top:40%;left:25%;"></span>
    <span class="star" style="top:55%;left:70%;"></span>
    <span class="star" style="top:62%;left:52%;"></span>
    <span class="star" style="top:75%;left:18%;"></span>
    <span class="star" style="top:82%;left:80%;"></span>

</div>

<div class="container">

    <div class="login-card">

        <div class="logo">
            <img src="logo.png" alt="Getwell Logo">
        </div>

        <p class="small-title">
            Powered by Getwell Clinic
        </p>

        <h1>
            Getwell Nutrition Coach
        </h1>

        <h2>
            Your personal health companion.
        </h2>

        <p class="description">
            Log in with your Patient ID to access your food diary,
            nutrition guidance, progress tracking and personalised
            recommendations.
        </p>

        <form>

            <div class="input-box">

                <svg xmlns="http://www.w3.org/2000/svg" width="20"
                height="20" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">

                <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A8 8 0 1118.879
                6.196M15 11a3 3 0 11-6 0
                3 3 0 016 0z"/>

                </svg>

                <input
                type="text"
                placeholder="Patient ID"
                required>

            </div>

            <div class="input-box">

                <svg xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">

                <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m6-6V9a6
                6 0 10-12 0v2m12
                0H6a2 2 0 00-2 2v6a2
                2 0 002 2h12a2 2 0
                002-2v-6a2 2 0
                00-2-2z"/>

                </svg>

                <input
                type="password"
                placeholder="Password"
                required>

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <a href="#" class="help">
            Need help? Contact Getwell Clinic
        </a>

    </div>

</div>

</body>
</html>
