<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Getwell Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef6ff;
padding:30px;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-size:30px;
font-weight:700;
color:#204c9c;
}

.patient{
font-size:18px;
font-weight:600;
color:#555;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:15px;
color:#204c9c;
}

.value{
font-size:35px;
font-weight:700;
color:#2d5cff;
}

.progress{
height:12px;
background:#ddd;
border-radius:50px;
overflow:hidden;
margin-top:15px;
}

.progress span{
display:block;
height:100%;
width:60%;
background:#4fa8ff;
}

button{
margin-top:30px;
padding:15px 30px;
border:none;
border-radius:15px;
background:#2d5cff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1f49d8;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
Getwell Nutrition Coach
</div>

<div class="patient" id="patientName">
Welcome
</div>

</div>

<div class="grid">

<div class="card">
<h3>Current Weight</h3>
<div class="value" id="currentWeight">Loading...</div>
</div>

<div class="card">
<h3>Goal Weight</h3>
<div class="value" id="goalWeight">Loading...</div>
</div>

<div class="card">
<h3>BMI</h3>
<div class="value" id="bmi">Loading...</div>
</div>

<div class="card">
<h3>Water Intake</h3>
<div class="value" id="water">Loading...</div>
</div>

<div class="card">
<h3>Weight Progress</h3>

<div class="progress">
<span></span>
</div>

</div>

<div class="card">
<h3>Next Appointment</h3>
<div class="value" id="appointment" style="font-size:22px;">
Loading...
</div>
</div>

</div>

<button id="logoutBtn">
Logout
</button>

</div>
<script type="module">

import { auth, db } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

onAuthStateChanged(auth, (user) => {

    if(user){

        const patientId = user.email.split("@")[0].toUpperCase();

const docRef = doc(db, "patients", patientId);
const docSnap = await getDoc(docRef);

if (docSnap.exists()) {

    const data = docSnap.data();

    document.getElementById("patientName").innerHTML =
        "Welcome, " + data.name;

    document.getElementById("currentWeight").innerHTML =
        data.currentWeight + " kg";

    document.getElementById("goalWeight").innerHTML =
        data.goalWeight + " kg";

    document.getElementById("bmi").innerHTML =
        data.bmi;

    document.getElementById("water").innerHTML =
        data.water + " / 8";

    document.getElementById("appointment").innerHTML =
        data.appointment;
}

    }else{

        window.location.href="index.html";

    }

});

</script>
  
</body>
</html>
